<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--SEO-->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg fill='%230A0A0A'%3E%3Crect x='9' y='9' width='22' height='22'/%3E%3Crect x='9' y='9' width='22' height='22' transform='rotate(45 20 20)'/%3E%3C/g%3E%3Ccircle cx='20' cy='20' r='4.2' fill='%23D8B35A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Montserrat:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Montserrat:wght@400;500;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="chrome-top"></div>

  <main>
    <h1 class="sr-only">Janissary Wear: men's and women's streetwear, cash on delivery across Bangladesh</h1>
    <div id="sections"><!--HOME--></div>

    <section class="section cat-strip" aria-labelledby="cat-h">
      <div class="wrap">
        <div class="section-head">
          <div><h2 id="cat-h">Shop by category</h2></div>
          <a class="link-more" href="/categories">All categories</a>
        </div>
        <div class="hero-tiles" id="cats"></div>
        <div class="style-rows" id="styles" style="margin-top:1.4rem"></div>
      </div>
    </section>

    <section class="band on-dark" aria-label="Delivery">
      <div class="wrap band-grid" id="band"><!--BAND--></div>
    </section>
  </main>

  <div id="chrome-bottom"></div>

  <script src="/js/app.js"></script>
  <script src="/js/track.js"></script>
  <script>
    JW.renderChrome('home');
    document.getElementById('cats').innerHTML = Array.from({ length: 2 }, () => '<div class="skeleton" style="aspect-ratio:4/3"></div>').join('');

    JW.loadCats().then((cats) => {
      const tops = JW.tops(cats);
      document.getElementById('cats').innerHTML = tops.length ? tops.map((c) => JW.catTile(c)).join('') : '';
      document.getElementById('styles').innerHTML = tops.filter((t) => JW.kidsOf(t.slug, cats).length).map((t) =>
        `<div class="style-row"><h3>${JW.esc(t.name)}</h3>${JW.kidsOf(t.slug, cats).map((k) => `<a class="chip" href="${JW.catUrl(k.slug)}">${JW.esc(k.name)}</a>`).join('')}</div>`).join('');
    }).catch(() => { document.getElementById('cats').innerHTML = ''; });
  </script>
</body>
</html>
