<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--SEO-->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg fill='%230A0A0A'%3E%3Crect x='9' y='9' width='22' height='22'/%3E%3Crect x='9' y='9' width='22' height='22' transform='rotate(45 20 20)'/%3E%3C/g%3E%3Ccircle cx='20' cy='20' r='4.2' fill='%23D8B35A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="chrome-top"></div>
  <main class="wrap" id="root"><!--PRODUCT--></main>
  <div id="chrome-bottom"></div>

  <script src="/js/app.js"></script>
  <script src="/js/track.js"></script>
  <script>
    JW.renderChrome();
    const root = document.getElementById('root');
    const p = window.__P__;
    let settings = {};
    document.addEventListener('jw:settings', (e) => { settings = e.detail; if (p) renderWA(); });

    // the size and color the customer has chosen right now
    function chosen() {
      const val = (n) => (root.querySelector(`input[name=${n}]:checked`) || {}).value || '';
      return { size: val('size'), color: val('color') };
    }

    function renderWA() {
      const box = document.getElementById('waFloat');
      if (!box || !settings.whatsapp) return;
      const c = chosen();
      const opts = [c.size && 'Size ' + c.size, c.color].filter(Boolean).join(', ');
      const msg = encodeURIComponent(`Hello, I want to order: ${p.name}${opts ? ' (' + opts + ')' : ''} (${JW.money(JW.priceOf(p, c.size, c.color))}). ${location.href}`);
      box.dataset.custom = '1';
      box.href = `https://wa.me/${settings.whatsapp}?text=${msg}`;
      box.hidden = false;
    }

    if (p) {
      document.body.classList.add('has-buy-bar');
      const qty = document.getElementById('qty');
      const maxQty = () => { const c = chosen(); return Math.min(20, Math.max(1, JW.stockOf(p, c.size, c.color))); };
      const clamp = () => { qty.max = maxQty(); qty.value = Math.max(1, Math.min(maxQty(), parseInt(qty.value) || 1)); };
      document.getElementById('minus').onclick = () => { qty.value = (parseInt(qty.value) || 1) - 1; clamp(); };
      document.getElementById('plus').onclick = () => { qty.value = (parseInt(qty.value) || 1) + 1; clamp(); };
      qty.onchange = clamp;

      root.querySelectorAll('.thumb').forEach((t) => t.addEventListener('click', () => {
        const main = document.querySelector('#main img');
        main.src = t.dataset.src;
        main.alt = t.querySelector('img').alt;
        root.querySelectorAll('.thumb').forEach((x) => x.classList.toggle('active', x === t));
      }));

      // when a color is chosen, show the photo of that color
      function showColor(color) {
        const u = (p.colorImages || {})[color];
        if (!u) return;
        const main = document.querySelector('#main img');
        const alt = `${p.name} – ${color}`;
        if (main) { main.src = u; main.alt = alt; }
        else document.getElementById('main').innerHTML = `<img src="${JW.esc(u)}" alt="${JW.esc(alt)}">`;
        root.querySelectorAll('.thumb').forEach((x) => x.classList.toggle('active', x.dataset.src === u));
      }

      // price, stock, button and photo follow the chosen size and color
      function refresh() {
        const { size, color } = chosen();
        const v = JW.variantOf(p, size, color);
        const own = !!(v && v.price > 0);
        const stock = JW.stockOf(p, size, color);
        const sale = !own && JW.onSale(p);
        document.getElementById('price').innerHTML = `<span class="now${sale ? ' sale' : ''}">${JW.money(JW.priceOf(p, size, color))}</span>${sale ? `<s>${JW.money(p.price)}</s>` : ''}`;
        const add = document.getElementById('add');
        add.disabled = stock <= 0;
        add.textContent = stock <= 0 ? 'Sold out' : 'Add to cart';
        document.getElementById('buy').disabled = stock <= 0;
        document.getElementById('stockNote').textContent = stock > 0 && stock <= 5 ? `Only ${stock} left` : '';
        clamp();
        renderWA();
        if (color) showColor(color);
      }
      root.querySelectorAll('input[name=size], input[name=color]').forEach((r) => r.addEventListener('change', refresh));

      document.getElementById('add').onclick = () => {
        clamp();
        const { size, color } = chosen();
        JW.cart.add({ id: p.id, size, color, qty: parseInt(qty.value) });
        JW.track('AddToCart', { items: [JW.trackItem(p, size, color, parseInt(qty.value))] });
        JW.toast('Added to your cart');
      };

      document.getElementById('buy').onclick = () => {
        clamp();
        const { size, color } = chosen();
        JW.cart.add({ id: p.id, size, color, qty: parseInt(qty.value) });
        JW.track('AddToCart', { items: [JW.trackItem(p, size, color, parseInt(qty.value))] });
        location.href = '/cart';
      };

            // photos in the suggestion rows load only when they come near the screen
      const late = root.querySelectorAll('img[data-src]');
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((list) => list.forEach((en) => { if (en.isIntersecting) { en.target.src = en.target.dataset.src; io.unobserve(en.target); } }), { rootMargin: '300px' });
        late.forEach((i) => io.observe(i));
      } else late.forEach((i) => { i.src = i.dataset.src; });

      refresh();
      const first = chosen();
      JW.loadCats().catch(() => []).then((cats) => {
        JW.setActive(p.category);
        JW.track('ViewContent', { items: [JW.trackItem(p, first.size, first.color, 1)], category: JW.catPath(p.category, cats) });
      });
    }
  </script>
</body>
</html>
