<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--SEO-->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg fill='%230A0A0A'%3E%3Crect x='9' y='9' width='22' height='22'/%3E%3Crect x='9' y='9' width='22' height='22' transform='rotate(45 20 20)'/%3E%3C/g%3E%3Ccircle cx='20' cy='20' r='4.2' fill='%23D8B35A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="chrome-top"></div>
  <main class="wrap" id="root">
    <div class="pdp"><div class="skeleton" style="aspect-ratio:4/5"></div><div class="skeleton" style="height:420px"></div></div>
  </main>
  <div id="chrome-bottom"></div>

  <script src="/js/app.js"></script>
  <script src="/js/track.js"></script>
  <script>
    JW.renderChrome();
    const root = document.getElementById('root');
    const id = window.__PID__ || '';
    let settings = {};
    document.addEventListener('jw:settings', (e) => { settings = e.detail; if (window.__p) renderWA(); });

    function notFound(msg) {
      root.innerHTML = `<div class="empty" style="margin:3rem 0 4.5rem"><h3>${JW.esc(msg || 'Product not found')}</h3><p>It may have been removed or is no longer available.</p><a class="btn btn-dark" href="/products">See all products</a></div>`;
    }

    // the size and color the customer has chosen right now
    function chosen() {
      const val = (n) => (root.querySelector(`input[name=${n}]:checked`) || {}).value || '';
      return { size: val('size'), color: val('color') };
    }

    function renderWA() {
      const p = window.__p;
      const box = document.getElementById('waFloat');
      if (!box || !settings.whatsapp) return;
      const c = chosen();
      const opts = [c.size && 'Size ' + c.size, c.color].filter(Boolean).join(', ');
      const msg = encodeURIComponent(`Hello, I want to order: ${p.name}${opts ? ' (' + opts + ')' : ''} (${JW.money(JW.priceOf(p, c.size, c.color))}). ${location.href}`);
      box.dataset.custom = '1';
      box.href = `https://wa.me/${settings.whatsapp}?text=${msg}`;
      box.hidden = false;
    }

    function optGroup(name, label, values) {
      if (!values.length) return '';
      return `<div class="opt"><div class="opt-label" id="lbl-${name}">${label}</div><div class="opt-list" role="radiogroup" aria-labelledby="lbl-${name}">` +
        values.map((v, i) => `<input type="radio" name="${name}" id="${name}-${i}" value="${JW.esc(v)}"${i === 0 ? ' checked' : ''}><label for="${name}-${i}">${JW.esc(v)}</label>`).join('') +
        `</div></div>`;
    }

    Promise.all([JW.api('products?id=' + encodeURIComponent(id || '')), JW.loadCats()]).then(([p, cats]) => {
      window.__p = p;
      const cat = JW.bySlug(p.category, cats);
      const parent = cat && cat.parent ? JW.bySlug(cat.parent, cats) : null;
      JW.setActive(p.category);
      document.title = p.name + ' | Janissary Wear';
      const imgs = p.images.length ? p.images : [];

      root.innerHTML = `
        <div class="crumbs" style="padding-top:1.6rem"><a href="/">Home</a> / ${parent ? `<a href="${JW.catUrl(parent.slug)}">${JW.esc(parent.name)}</a> / ` : ''}${cat ? `<a href="${JW.catUrl(cat.slug)}">${JW.esc(cat.name)}</a> / ` : ''}${JW.esc(p.name)}</div>
        <div class="pdp" style="padding-top:1rem">
          <div>
            <div class="gallery-main" id="main">${imgs.length ? `<img src="${JW.esc(imgs[0])}" alt="${JW.esc(p.name)}">` : `<div class="ph">${JW.STAR('#0A0A0A', '#B08A3A')}</div>`}</div>
            ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((s, i) => `<button class="thumb${i === 0 ? ' active' : ''}" data-src="${JW.esc(s)}" aria-label="Show photo ${i + 1}"><img src="${JW.esc(s)}" alt=""></button>`).join('')}</div>` : ''}
          </div>
          <div class="pdp-info">
            ${cat ? `<a class="product-cat" href="${JW.catUrl(cat.slug)}">${JW.esc(JW.catPath(cat.slug, cats))}</a>` : ''}
            <h1>${JW.esc(p.name)}</h1>
            <div class="pdp-price" id="price"></div>
            ${p.description ? `<p class="pdp-desc">${JW.esc(p.description)}</p>` : ''}
            ${optGroup('size', 'Size', p.sizes || [])}
            ${optGroup('color', 'Color', p.colors || [])}
            <div class="buy-row">
              <div class="qty" aria-label="Quantity">
                <button type="button" id="minus" aria-label="Decrease quantity">&minus;</button>
                <input id="qty" type="number" min="1" max="20" value="1" aria-label="Quantity">
                <button type="button" id="plus" aria-label="Increase quantity">+</button>
              </div>
              <button class="btn btn-ghost" id="add" style="flex:1">Add to cart</button>
              <button class="btn btn-primary" id="buy" style="flex:1">Buy now</button>
            </div>
            <div class="stock-note" id="stockNote"></div>
            <div class="facts">
              <div><span>Delivery inside Dhaka</span><span class="d-in">-</span></div>
              <div><span>Delivery outside Dhaka</span><span class="d-out">-</span></div>
              <div><span>Payment</span><span>Cash on delivery</span></div>
            </div>
          </div>
        </div>`;

      document.body.classList.add('has-buy-bar');
      const qty = document.getElementById('qty');
      const maxQty = () => { const c = chosen(); return Math.min(20, Math.max(1, JW.stockOf(p, c.size, c.color))); };
      const clamp = () => { qty.max = maxQty(); qty.value = Math.max(1, Math.min(maxQty(), parseInt(qty.value) || 1)); };
      document.getElementById('minus').onclick = () => { qty.value = (parseInt(qty.value) || 1) - 1; clamp(); };
      document.getElementById('plus').onclick = () => { qty.value = (parseInt(qty.value) || 1) + 1; clamp(); };
      qty.onchange = clamp;

      root.querySelectorAll('.thumb').forEach((t) => t.addEventListener('click', () => {
        document.querySelector('#main img').src = t.dataset.src;
        root.querySelectorAll('.thumb').forEach((x) => x.classList.toggle('active', x === t));
      }));

      // when a color is chosen, show the photo of that color
      function showColor(color) {
        const u = (p.colorImages || {})[color];
        if (!u) return;
        const main = document.querySelector('#main img');
        if (main) main.src = u;
        else document.getElementById('main').innerHTML = `<img src="${JW.esc(u)}" alt="${JW.esc(p.name)}">`;
        root.querySelectorAll('.thumb').forEach((x) => x.classList.toggle('active', x.dataset.src === u));
      }

      // price, stock, button and photo follow the chosen size and color
      function refresh() {
        const { size, color } = chosen();
        const v = JW.variantOf(p, size, color);
        const own = !!(v && v.price > 0);
        const stock = JW.stockOf(p, size, color);
        const sale = !own && JW.onSale(p);
        document.getElementById('price').innerHTML = `<span class="now${sale ? ' sale' : ''}">${JW.money(JW.priceOf(p, size, color))}</span>${sale ? `<s>${JW.money(p.price)}</s>` : ''}`;
        const add = document.getElementById('add');
        add.disabled = stock <= 0;
        add.textContent = stock <= 0 ? 'Sold out' : 'Add to cart';
        document.getElementById('buy').disabled = stock <= 0;
        document.getElementById('stockNote').textContent = stock > 0 && stock <= 5 ? `Only ${stock} left` : '';
        clamp();
        renderWA();
        if (color) showColor(color);
      }
      root.querySelectorAll('input[name=size], input[name=color]').forEach((r) => r.addEventListener('change', refresh));

      document.getElementById('add').onclick = () => {
        clamp();
        const { size, color } = chosen();
        JW.cart.add({ id: p.id, size, color, qty: parseInt(qty.value) });
        JW.track('AddToCart', { items: [JW.trackItem(p, size, color, parseInt(qty.value))] });
        JW.toast('Added to your cart');
      };

      document.getElementById('buy').onclick = () => {
        clamp();
        const { size, color } = chosen();
        JW.cart.add({ id: p.id, size, color, qty: parseInt(qty.value) });
        JW.track('AddToCart', { items: [JW.trackItem(p, size, color, parseInt(qty.value))] });
        location.href = '/cart';
      };

      const fill = (s) => {
        const a = root.querySelector('.d-in'), b = root.querySelector('.d-out');
        if (a) a.textContent = JW.money(s.shippingInside);
        if (b) b.textContent = JW.money(s.shippingOutside);
      };
      if (settings.storeName) fill(settings);
      document.addEventListener('jw:settings', (e) => fill(e.detail));
      refresh();
      const first = chosen();
      JW.track('ViewContent', { items: [JW.trackItem(p, first.size, first.color, 1)], category: JW.catPath(p.category, cats) });
    }).catch((e) => notFound(e.message === 'Product not found' ? '' : e.message));
  </script>
</body>
</html>
