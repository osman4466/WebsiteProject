<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All products | Janissary Wear</title>
  <meta name="description" content="Shop every Janissary Wear piece. Filter by category, search by name, pay on delivery.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg fill='%23B4232C'%3E%3Crect x='9' y='9' width='22' height='22'/%3E%3Crect x='9' y='9' width='22' height='22' transform='rotate(45 20 20)'/%3E%3C/g%3E%3Ccircle cx='20' cy='20' r='4.2' fill='%23D8B35A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hind+Siliguri:wght@400;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="chrome-top"></div>
  <main>
    <div class="page-head"><div class="wrap">
      <div class="crumbs"><a href="/">Home</a> / <span id="crumb">All products</span></div>
      <h1 id="title" style="font-size:clamp(2.2rem,5vw,3.6rem)">All products</h1>
      <p id="subtitle"></p>
    </div></div>

    <div class="wrap">
      <div class="filters">
        <div class="chips" id="chips" role="tablist" aria-label="Filter by category"></div>
        <div class="tools">
          <label class="sr-only" for="q">Search products</label>
          <input class="input" id="q" type="search" placeholder="Search products">
          <label class="sr-only" for="sort">Sort</label>
          <select class="select" id="sort">
            <option value="new">Newest</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
          </select>
        </div>
      </div>
      <div class="product-grid" id="grid" style="padding-bottom:4.5rem"></div>
    </div>
  </main>
  <div id="chrome-bottom"></div>

  <script src="/js/app.js"></script>
  <script>
    JW.renderChrome('products');
    const params = new URLSearchParams(location.search);
    let active = params.get('category') || '';
    let all = [], cats = [];
    const grid = document.getElementById('grid');
    const qEl = document.getElementById('q');
    const sortEl = document.getElementById('sort');
    qEl.value = params.get('q') || '';

    grid.innerHTML = Array.from({ length: 8 }, () => '<div class="skeleton" style="aspect-ratio:4/5"></div>').join('');

    function drawChips() {
      const chips = [{ slug: '', name: 'All' }, ...cats];
      document.getElementById('chips').innerHTML = chips.map((c) =>
        `<button class="chip${c.slug === active ? ' active' : ''}" data-slug="${JW.esc(c.slug)}" aria-pressed="${c.slug === active}">${JW.esc(c.name)}</button>`).join('');
    }

    function draw() {
      const t = qEl.value.trim().toLowerCase();
      let list = all.filter((p) => (!active || p.category === active) && (!t || (p.name + ' ' + p.description).toLowerCase().includes(t)));
      if (sortEl.value === 'low') list.sort((a, b) => JW.unitPrice(a) - JW.unitPrice(b));
      else if (sortEl.value === 'high') list.sort((a, b) => JW.unitPrice(b) - JW.unitPrice(a));
      else list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      const cat = cats.find((c) => c.slug === active);
      document.getElementById('title').textContent = cat ? cat.name : 'All products';
      document.getElementById('crumb').textContent = cat ? cat.name : 'All products';
      document.getElementById('subtitle').textContent = cat ? cat.description || '' : '';
      document.title = (cat ? cat.name : 'All products') + ' | Janissary Wear';

      grid.innerHTML = list.length
        ? list.map((p) => JW.productCard(p, cats)).join('')
        : `<div class="empty" style="grid-column:1/-1"><h3>${all.length ? 'Nothing matches that search' : 'No products yet'}</h3><p>${all.length ? 'Try another category or clear the search.' : 'New pieces will appear here as soon as they are added.'}</p></div>`;
    }

    document.getElementById('chips').addEventListener('click', (e) => {
      const b = e.target.closest('.chip'); if (!b) return;
      active = b.dataset.slug;
      history.replaceState(null, '', active ? '?category=' + encodeURIComponent(active) : location.pathname);
      drawChips(); draw();
    });
    qEl.addEventListener('input', draw);
    sortEl.addEventListener('change', draw);

    Promise.all([JW.api('categories'), JW.api('products')]).then(([c, p]) => {
      cats = c; all = p; drawChips(); draw();
    }).catch((e) => {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>Could not load products</h3><p>${JW.esc(e.message)}</p></div>`;
    });
  </script>
</body>
</html>
