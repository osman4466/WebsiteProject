<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories | Janissary Wear</title>
  <meta name="description" content="Browse Janissary Wear by category: men and women, t-shirts, polo shirts and drop shoulders.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg fill='%230A0A0A'%3E%3Crect x='9' y='9' width='22' height='22'/%3E%3Crect x='9' y='9' width='22' height='22' transform='rotate(45 20 20)'/%3E%3C/g%3E%3Ccircle cx='20' cy='20' r='4.2' fill='%23D8B35A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="chrome-top"></div>
  <main>
    <div class="page-head"><div class="wrap">
      <div class="crumbs"><a href="/">Home</a> / Categories</div>
      <h1 style="font-size:clamp(2.2rem,5vw,3.6rem)">Categories</h1>
      <p>Pick a category to see everything in it.</p>
    </div></div>
    <section class="section-tight" style="padding-bottom:4.5rem"><div class="wrap">
      <div id="cats"></div>
    </div></section>
  </main>
  <div id="chrome-bottom"></div>

  <script src="/js/app.js"></script>
  <script>
    JW.renderChrome();
    const box = document.getElementById('cats');
    box.innerHTML = '<div class="skeleton" style="height:320px"></div>';
    JW.loadCats().then((cats) => {
      const tops = JW.tops(cats);
      box.innerHTML = tops.length ? tops.map((t) => {
        const kids = JW.kidsOf(t.slug, cats);
        return `<section class="cat-section">
          <div class="section-head"><div><h2>${JW.esc(t.name)}</h2>${t.description ? `<p>${JW.esc(t.description)}</p>` : ''}</div>
            <a class="link-more" href="${JW.catUrl(t.slug)}">View all ${JW.esc(t.name)}</a></div>
          <div class="cat-grid large">${(kids.length ? kids : [t]).map((c) => JW.catTile(c, true)).join('')}</div>
        </section>`;
      }).join('') : '<div class="empty"><h3>No categories yet</h3><p>Categories will appear here once they are added.</p></div>';
    }).catch((e) => {
      box.innerHTML = `<div class="empty"><h3>Could not load categories</h3><p>${JW.esc(e.message)}</p></div>`;
    });
  </script>
</body>
</html>
